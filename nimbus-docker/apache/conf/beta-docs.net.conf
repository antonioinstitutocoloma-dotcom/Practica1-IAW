<VirtualHost *:80>
    ServerName beta-docs.net
    DocumentRoot /var/www/html/beta

    <Directory /var/www/html/beta>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # Fichero sensible protegido (requisito: prohibido usar wp-config.php)
    <Files "credenciales-admin.env">
        Require all denied
    </Files>

    ErrorLog /var/log/apache2/beta_error.log
    CustomLog /var/log/apache2/beta_access.log combined
</VirtualHost>
