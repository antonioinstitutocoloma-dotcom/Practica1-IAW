limit_req_zone $binary_remote_addr zone=nimbus_limit:10m rate=6r/s;

server {
    listen 80;
    server_name alpha-docs.net beta-docs.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name alpha-docs.net beta-docs.net;

    ssl_certificate /etc/nginx/certs/alpha-docs.crt;
    ssl_certificate_key /etc/nginx/certs/alpha-docs.key;

    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        
        limit_req zone=nimbus_limit burst=3 nodelay;

        
        proxy_pass http://apache-backend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
